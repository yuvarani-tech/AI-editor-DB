<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - AI Voice Text Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;600;700&family=Montserrat:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;700&family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-mode">
    <div class="background-animation"></div>

    <div class="app-container">
        <!-- Main Sidebar -->
        <aside class="main-sidebar">
            <div class="logo">
                <i class="ph ph-waves"></i>
            </div>
            <nav class="sidebar-nav">
                <a href="editor.html" class="nav-item" title="Editor"><i class="ph ph-pencil-simple"></i></a>
                <a href="history.html" class="nav-item" title="History"><i class="ph ph-clock-counter-clockwise"></i></a>
                <a href="settings.html" class="nav-item active" title="Settings"><i class="ph ph-gear"></i></a>
                <a href="index.html" class="nav-item" title="Home"><i class="ph ph-house"></i></a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <div class="header-center">
                    <h1 class="gradient-text">Preferences</h1>
                    <p class="subtitle">Customize your writing environment</p>
                </div>
                <div class="header-right">
                    <button class="action-btn primary small" id="saveSettingsBtn">
                        <i class="ph ph-floppy-disk"></i>
                        <span>Save Changes</span>
                    </button>
                </div>
            </header>

            <div class="settings-page-container">
                <div class="settings-card">
                    <h3>Appearance</h3>
                    
                    <div class="setting-group-row">
                        <label for="themeSelect">Theme Mode</label>
                        <select id="themeSelect">
                            <option value="dark">Dark Mode</option>
                            <option value="light">Light Mode</option>
                            <option value="neon">Neon Mode</option>
                        </select>
                    </div>

                    <div class="setting-group-row">
                        <label for="bgSound">Background Sound 🎵</label>
                        <select id="bgSound">
                            <option value="none">None</option>
                            <option value="rain">🌧️ Rain</option>
                            <option value="cafe">☕ Cafe</option>
                            <option value="ocean">🌊 Ocean</option>
                        </select>
                    </div>

                    <div class="setting-group-row">
                        <label for="bgSoundVolume">Sound Volume (<span id="soundVolumeDisplay">50%</span>)</label>
                        <input type="range" id="bgSoundVolume" min="0" max="100" value="50">
                    </div>
                </div>

                <div class="settings-card">
                    <h3>Typography</h3>
                    
                    <div class="setting-group-row">
                        <label for="fontFamily">Font Family</label>
                        <select id="fontFamily">
                            <option value="'Inter', sans-serif">Inter</option>
                            <option value="'Roboto', sans-serif">Roboto</option>
                            <option value="'Outfit', sans-serif">Outfit</option>
                            <option value="'Poppins', sans-serif">Poppins</option>
                            <option value="'Montserrat', sans-serif">Montserrat</option>
                            <option value="'Fira Code', monospace">Fira Code</option>
                            <option value="monospace">Monospace</option>
                        </select>
                    </div>

                    <div class="setting-group-row">
                        <label for="fontSize">Font Size (<span id="fontSizeDisplay">16px</span>)</label>
                        <input type="range" id="fontSize" min="12" max="32" value="16">
                    </div>
                </div>

                <div class="settings-card">
                    <h3>Voice & Speech</h3>
                    
                    <div class="setting-group-row">
                        <label for="languageSelect">Recognition Language</label>
                        <select id="languageSelect">
                            <option value="en-US">English (US)</option>
                            <option value="en-GB">English (UK)</option>
                            <option value="es-ES">Spanish</option>
                            <option value="fr-FR">French</option>
                        </select>
                    </div>

                    <div class="setting-group-row">
                        <label for="voiceSpeed">Reading Speed (<span id="voiceSpeedDisplay">1.0</span>x)</label>
                        <input type="range" id="voiceSpeed" min="0.5" max="2.0" step="0.1" value="1.0">
                    </div>
                </div>
            </div>
            
            <div id="toast" class="toast">Action completed successfully.</div>
        </main>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
