<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - AI Voice Text Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Roboto:wght@300;400;500;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-mode">
    <div class="background-animation"></div>

    <div class="app-container">
        <!-- Main Sidebar -->
        <aside class="main-sidebar">
            <div class="logo">
                <i class="ph ph-waves"></i>
            </div>
            <nav class="sidebar-nav">
                <a href="editor.html" class="nav-item" title="Editor"><i class="ph ph-pencil-simple"></i></a>
                <a href="history.html" class="nav-item active" title="History"><i class="ph ph-clock-counter-clockwise"></i></a>
                <a href="settings.html" class="nav-item" title="Settings"><i class="ph ph-gear"></i></a>
                <a href="index.html" class="nav-item" title="Home"><i class="ph ph-house"></i></a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <div class="header-center">
                    <h1 class="gradient-text">Note History</h1>
                    <p class="subtitle">Access your previously saved documents</p>
                </div>
            </header>

            <div class="history-container" id="historyContainer">
                <div class="loading-spinner"><i class="ph ph-spinner ph-spin"></i> Loading notes...</div>
            </div>
            
            <div id="toast" class="toast">Action completed successfully.</div>
        </main>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
